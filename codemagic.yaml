workflows:
  build-wqterm-ipa:
    name: Build WQTerm IPA (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build WQTerm IPA via scripts/build.sh
        script: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
    artifacts:
      - build/WQTerm.ipa

